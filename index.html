.loading-stack{display:flex;flex-direction:column;align-items:center;gap:35px}.loading-text{min-height:1.3em;white-space:pre;animation:none}.loading-text.glitching{animation:glitch .42s steps(2,end) 3}.loading-text.glitching:before{animation:ghostA .42s steps(2,end) 3}.loading-text.glitching:after{animation:ghostB .42s steps(2,end) 3}.type-cursor{display:inline-block;font-weight:400;margin-left:3px;animation:cursorBlink .65s steps(1) infinite}.sound-enable{border:1px solid #555;border-radius:20px;background:#222;color:#ddd;font-size:13px;padding:9px 17px;cursor:pointer;transition:opacity .25s}.sound-enable:disabled{opacity:.4;cursor:default}@keyframes cursorBlink{0%,49%{opacity:1}50%,100%{opacity:0}}

/* v20: keep the typewriter and kanji on the same optical center. */
#loading .loading-stack{position:static;display:contents}
#loading .loading-text{position:absolute;left:0;right:0;top:50%;margin-top:-.65em;text-align:center;z-index:2;transition:opacity .65s ease,filter .65s ease}
#loading .sound-enable{position:fixed;left:50%;bottom:clamp(25px,7vh,75px);transform:translateX(-50%);z-index:100;white-space:nowrap;max-width:calc(100vw - 32px)}
#loading.third-cycle .loading-text{opacity:.48;filter:blur(2px)}
#loading.third-cycle .loading-text:before,#loading.third-cycle .loading-text:after{opacity:.25}
#title-interlude.overlap-loading .kanji-sequence{z-index:8}
#title-interlude.overlap-loading .kanji-word{position:relative;top:0;left:0}
#loading.third-cycle .sound-enable{opacity:0;pointer-events:none}
/* Third loading pass overlaps the Chinese-character title while the signal decays. */
#title-interlude.overlap-loading{background:transparent;pointer-events:none}
#title-interlude.overlap-loading .kanji-sequence{z-index:8}
#title-interlude.overlap-loading .kanji-word{text-shadow:0 0 13px rgba(255,0,0,.28)}
#title-interlude.overlap-loading::before{z-index:9}
#title-interlude.overlap-loading .glitch-band{z-index:10}
#loading.third-cycle .loading-text{animation:glitch .32s steps(2,end) infinite}
#loading.third-cycle .loading-text:before{animation:ghostA .32s steps(2,end) infinite}
#loading.third-cycle .loading-text:after{animation:ghostB .32s steps(2,end) infinite}
/* Post-login corrupted title interlude: single transparent-mask glyph, no ghost image */
#title-interlude.final div.title-symbol{opacity:1!important;visibility:visible!important;background-color:#ff0000!important;animation:none!important;display:block!important}
#title-interlude.final:not(.flash)::after{opacity:0!important;animation:none!important}
#title-interlude{position:fixed;inset:0;background:#0e0e0e;z-index:80;display:none;align-items:center;justify-content:center;overflow:hidden;isolation:isolate}
#title-interlude.active{display:flex}
#title-interlude::before{content:"";position:absolute;inset:-15%;pointer-events:none;opacity:0;background:repeating-linear-gradient(0deg,transparent 0 3px,rgba(150,150,150,.055) 4px,transparent 5px);mix-blend-mode:screen;z-index:5}
#title-interlude.corrupt::before{animation:screenNoise .087s steps(2,end) infinite;opacity:.52}
#title-interlude::after{content:"";position:absolute;inset:0;pointer-events:none;z-index:7;background:rgba(255,255,255,0)}
#title-interlude.flash::after{animation:hardFlash .373s steps(1,end) both}
.title-symbol{width:clamp(96px,9vw,142px);aspect-ratio:102/223;height:auto;position:relative;z-index:3;opacity:0;background-color:#450000;-webkit-mask-image:var(--title-mask);mask-image:var(--title-mask);-webkit-mask-position:center;mask-position:center;-webkit-mask-repeat:no-repeat;mask-repeat:no-repeat;-webkit-mask-size:contain;mask-size:contain;transform:translateZ(0)}
#title-interlude.reveal div.title-symbol{opacity:1;animation:titleColor 3.1s linear forwards}
#title-interlude.final div.title-symbol{opacity:1;background-color:#ff0000;animation:none}
#title-interlude .title-ghost{position:absolute;z-index:2;opacity:0;pointer-events:none}
#title-interlude.corrupt .title-ghost{display:none}
#title-interlude .glitch-band{position:absolute;left:-10%;width:120%;height:7%;top:45%;background:rgba(125,125,125,.13);opacity:0;z-index:6;pointer-events:none}
#title-interlude.corrupt .glitch-band{animation:bandMove .18s steps(3,end) infinite}
@keyframes titleColor{0%{background-color:#450000}100%{background-color:#ff0000}}
@keyframes titleShake{0%,45%,100%{transform:translate(0,0)}50%{transform:translate(-5px,2px) skewX(2deg)}65%{transform:translate(4px,-2px)}75%{transform:translate(-2px,0)}}
@keyframes screenNoise{0%{transform:translate(0,0)}25%{transform:translate(-7px,8px)}50%{transform:translate(8px,-6px)}75%{transform:translate(-3px,12px)}100%{transform:translate(0,0)}}
@keyframes ghostTitle{0%,40%,100%{opacity:0;transform:translate(0)}45%{opacity:.7;transform:translate(-12px,3px);filter:drop-shadow(5px 0 #ff0000)}55%{opacity:.5;transform:translate(13px,-4px)}}
@keyframes bandMove{0%,100%{opacity:0;top:8%}30%{opacity:.55;top:72%}65%{opacity:.2;top:28%}}
@keyframes hardFlash{0%{background:#555}18%{background:#050505}35%{background:#383838}48%{background:#000}65%{background:#4a4a4a}78%,100%{background:transparent}}
@keyframes finalFlicker{0%{opacity:0}20%{opacity:1}30%{opacity:.1}45%,100%{opacity:1}}
@media(prefers-reduced-motion:reduce){#title-interlude .title-symbol{animation:none!important}#title-interlude.reveal div.title-symbol,#title-interlude.final div.title-symbol{opacity:1}}

/* Absolute-black background throughout the drum-only buildup and Korean reveal. */
#title-interlude.pure-black{background:#000!important}
#title-interlude.pure-black::before,#title-interlude.pure-black::after,#title-interlude.pure-black .glitch-band{display:none!important;animation:none!important}
/* Four-character title interference sequence */
#title-interlude .kanji-sequence{position:absolute;inset:0;display:flex;align-items:center;justify-content:center;z-index:4;pointer-events:none;opacity:0}
#title-interlude.kanji-phase .kanji-sequence{opacity:1}
#title-interlude.kanji-phase .title-symbol{opacity:0!important;animation:none!important}
.kanji-word{font-family:Pretendard,"Noto Sans CJK KR","Apple SD Gothic Neo",sans-serif;font-size:clamp(58px,6.3vw,100px);font-weight:800;letter-spacing:-.08em;white-space:nowrap;color:#a40000;text-shadow:0 0 8px rgba(255,0,0,.14);position:relative;line-height:1.2}
.kanji-word::before,.kanji-word::after{content:attr(data-word);position:absolute;inset:0;opacity:0;pointer-events:none}
.kanji-word.change-glitch{animation:kanjiJolt .167s steps(2,end) 1}
.kanji-word.change-glitch::before{color:#ff3333;animation:kanjiGhostLeft .167s steps(2,end) 1}
.kanji-word.change-glitch::after{color:#650000;animation:kanjiGhostRight .167s steps(2,end) 1}
@keyframes kanjiJolt{0%,100%{transform:translate(0)}20%{transform:translate(-3px,1px)}50%{transform:translate(3px,-1px)}75%{transform:translate(-1px,0)}}
@keyframes kanjiGhostLeft{0%,100%{opacity:0}20%,55%{opacity:.7;transform:translate(-5px,1px);clip-path:inset(5% 0 48% 0)}}
@keyframes kanjiGhostRight{0%,100%{opacity:0}35%,75%{opacity:.55;transform:translate(4px,-1px);clip-path:inset(53% 0 5% 0)}}
/* Burn-through transition: login remains visible beneath the advancing charred edge */
#burn-transition{position:fixed;inset:0;width:100%;height:100%;z-index:75;pointer-events:none;display:none}
#burn-transition.active{display:block}

#title-interlude .title-symbol{
  -webkit-mask-image:var(--title-mask),var(--title-mask),var(--title-mask),var(--title-mask),var(--title-mask),var(--title-mask),var(--title-mask),var(--title-mask),var(--title-mask);

  mask-position:center,calc(50% - 1.3px) center,calc(50% + 1.3px) center,center calc(50% - 1.3px),center calc(50% + 1.3px),calc(50% - 1px) calc(50% - 1px),calc(50% + 1px) calc(50% - 1px),calc(50% - 1px) calc(50% + 1px),calc(50% + 1px) calc(50% + 1px);

/* v22: third loading cycle dissolves into signal interference before a hard cut. */
#loading.dissolve-cycle .loading-text{opacity:0;filter:blur(7px);transition:opacity 1.2s ease,filter 1.2s ease}
#loading.dissolve-cycle::after{content:"";position:absolute;inset:0;pointer-events:none;z-index:6;background:repeating-linear-gradient(0deg,transparent 0 5px,rgba(95,95,95,.13) 6px,transparent 8px);animation:screenNoise .12s steps(2,end) infinite}
#loading.dissolve-cycle::before{content:"";position:absolute;inset:0;pointer-events:none;z-index:5;background:linear-gradient(transparent 0%,rgba(100,100,100,.15) 48%,transparent 52%);animation:bandMove .19s steps(2,end) infinite}
#title-interlude.buildup::before{opacity:.68;animation:screenNoise .055s steps(2,end) infinite}
#title-interlude.buildup .glitch-band{animation:bandMove .1s steps(3,end) infinite;opacity:.7}
/* A true silent blackout between the last kanji and Korean title. */
#title-interlude.silent-blackout{background:#000!important}
#title-interlude.silent-blackout::before,#title-interlude.silent-blackout::after,#title-interlude.silent-blackout .glitch-band,#title-interlude.silent-blackout .kanji-sequence,#title-interlude.silent-blackout .title-symbol{display:none!important;animation:none!important}

/* v29: one centered kanji title, switching every 0.1 seconds during film winding. */
#title-interlude.film-kanji .kanji-sequence{opacity:1!important;display:flex!important;justify-content:center!important;align-items:center!important;gap:0!important;padding:0 14px}
#title-interlude.film-kanji .kanji-word{font-size:clamp(48px,8vw,110px);letter-spacing:-.07em;white-space:nowrap;transition:none}
#title-interlude.film-kanji .kanji-word.film-swap{animation:filmKanjiPulse .075s steps(2,end) 1}
@keyframes filmKanjiPulse{0%{opacity:.48;filter:blur(2px)}100%{opacity:1;filter:none}}
#title-interlude.film-kanji .title-symbol{opacity:0!important;visibility:hidden!important}

/* SVTER lock screen, inserted between the title and the mail sign-in. */
#svter-lock{position:fixed;inset:0;z-index:60;color:white;overflow:hidden;opacity:0;visibility:hidden;transition:opacity .65s ease,visibility .65s;transform:translateY(0);font-family:Pretendard,-apple-system,sans-serif;letter-spacing:-.045em}

#svter-lock .lock-content{position:absolute;inset:0;transition:filter .4s ease,transform .4s ease;display:flex;align-items:center;flex-direction:column}
#svter-lock.pin-open .lock-content{filter:blur(17px) brightness(.6);transform:scale(1.045);pointer-events:none}
#svter-lock .lock-clock{position:absolute;top:clamp(68px,14.3vh,145px);left:0;right:0;text-align:center;font-size:clamp(86px,9.2vw,145px);font-weight:850;line-height:1.04;letter-spacing:-.07em;font-variant-numeric:tabular-nums;text-shadow:0 2px 12px #002b3340}
#svter-lock .lock-date{position:absolute;top:clamp(175px,30.5vh,294px);left:0;right:0;text-align:center;font-size:clamp(20px,2.15vw,34px);font-weight:550;white-space:nowrap}
#svter-lock .lock-notifications{position:absolute;top:45%;width:min(560px,calc(100vw - 34px));display:flex;flex-direction:column;gap:8px}
#svter-lock .lock-notice{border:0;text-align:left;width:100%;min-height:104px;padding:22px 32px;background:linear-gradient(110deg,rgba(0,72,89,.55),rgba(0,43,49,.88));border-radius:13px;color:#fff;backdrop-filter:blur(12px);-webkit-backdrop-filter:blur(12px);box-shadow:0 3px 16px #001b2514;transition:transform .2s,background .2s}
#svter-lock .lock-notice:active{transform:scale(.99)}
#svter-lock .notice-heading{display:flex;align-items:center;justify-content:space-between;gap:12px}
#svter-lock .notice-heading strong{font-size:24px;font-weight:850;letter-spacing:-.055em}
#svter-lock .notice-heading time{font-size:13px;font-weight:500;white-space:nowrap}
#svter-lock .notice-body{font-size:19px;margin-top:2px;font-weight:540;line-height:1.4}
#svter-lock .lock-notice.arriving{animation:lockNotificationIn .55s cubic-bezier(.15,.8,.22,1) both}
@keyframes lockNotificationIn{from{opacity:0;transform:translateY(-35px) scale(.97)}to{opacity:1;transform:translateY(0) scale(1)}}
#svter-lock .lock-open-btn{position:absolute;bottom:12.5%;left:50%;transform:translateX(-50%);border:0;border-radius:15px;background:#fff;color:#123c3b;font-size:25px;font-weight:850;padding:12px 26px;white-space:nowrap}
#svter-lock .pin-layer{position:absolute;inset:0;display:flex;align-items:center;flex-direction:column;opacity:0;visibility:hidden;pointer-events:none;transition:opacity .35s ease,visibility .35s}
#svter-lock.pin-open .pin-layer{opacity:1;visibility:visible;pointer-events:auto}
#svter-lock .pin-prompt{position:absolute;top:29%;font-size:clamp(24px,2.4vw,34px);font-weight:550;text-align:center;padding:0 16px}
#svter-lock .pin-hint{position:absolute;top:52%;font-size:19px;font-weight:550}
#svter-lock .pin-form{position:absolute;top:56.6%;display:flex;align-items:center;flex-direction:column;gap:24px;width:min(400px,calc(100vw - 48px))}
#svter-lock .pin-input{width:100%;height:56px;border:0;border-radius:15px;background:rgba(78,159,179,.55);outline:none;color:white;text-align:center;font-size:29px;letter-spacing:.35em;font-weight:650;padding:0 14px;caret-color:white}
#svter-lock .pin-input:focus{box-shadow:0 0 0 2px #ffffff88}
#svter-lock .pin-submit{border:0;border-radius:15px;background:#fff;color:#123c3b;font-size:25px;font-weight:850;padding:12px 26px}
#svter-lock .pin-back{position:absolute;left:24px;top:25px;background:#052b3366;color:white;border:1px solid #ffffff55;border-radius:50%;width:43px;height:43px;font-size:24px;cursor:pointer}
@media(max-width:600px){#svter-lock .lock-clock{top:17%;font-size:clamp(68px,16vw,105px)}#svter-lock .lock-date{top:31%;font-size:clamp(17px,4.4vw,25px)}#svter-lock .lock-notifications{top:44%}#svter-lock .lock-notice{min-height:83px;padding:14px 18px}#svter-lock .notice-heading strong{font-size:20px}#svter-lock .notice-body{font-size:15px}#svter-lock .lock-open-btn{bottom:11%;font-size:21px}#svter-lock .pin-prompt{top:31%}#svter-lock .pin-hint{top:52%}#svter-lock .pin-form{top:57%}}

/* v33: truly centered, consistently spaced clock and date */
#svter-lock .lock-datetime{position:absolute;top:clamp(68px,14.3vh,145px);left:0;right:0;width:100%;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:clamp(20px,2.7vh,30px);text-align:center;pointer-events:none}
#svter-lock .lock-datetime .lock-clock{position:static;inset:auto;width:100%;text-align:center;line-height:1;letter-spacing:-.055em;font-variant-numeric:tabular-nums}
#svter-lock .lock-datetime .lock-date{position:static;inset:auto;width:100%;text-align:center;font-weight:350;line-height:1.25;letter-spacing:-.035em}
@media(max-width:600px){#svter-lock .lock-datetime{top:17%;gap:clamp(16px,2.4vh,26px)}}
#svter-lock.pin-open .pin-layer{cursor:pointer}
#svter-lock.pin-open .pin-form,#svter-lock.pin-open .pin-form *{cursor:auto}
#svter-lock.pin-open .pin-submit{cursor:pointer}

/* v34: gentle motion for lock / PIN transitions, without changing the opening. */
#svter-lock{transition:opacity .85s cubic-bezier(.22,1,.36,1),visibility .85s;will-change:opacity,transform}
#svter-lock .lock-content{transition:filter .7s cubic-bezier(.22,1,.36,1),transform .7s cubic-bezier(.22,1,.36,1),opacity .7s ease;transform-origin:50% 45%;will-change:filter,transform}
#svter-lock.pin-open .lock-content{filter:blur(14px) brightness(.57);transform:scale(1.025)}
#svter-lock .pin-layer{transition:opacity .6s cubic-bezier(.22,1,.36,1),visibility .6s;will-change:opacity}
#svter-lock .pin-prompt,#svter-lock .pin-hint,#svter-lock .pin-form{transition:transform .65s cubic-bezier(.22,1,.36,1),opacity .65s ease;transform:translateY(12px);opacity:0}
#svter-lock.pin-open .pin-prompt,#svter-lock.pin-open .pin-hint,#svter-lock.pin-open .pin-form{transform:translateY(0);opacity:1}
#svter-lock .lock-notice{transition:transform .32s cubic-bezier(.22,1,.36,1),background .32s ease,box-shadow .32s ease}
#svter-lock .lock-open-btn,#svter-lock .pin-submit{transition:background .25s ease,box-shadow .25s ease,filter .25s ease}
#svter-lock .lock-open-btn:active,#svter-lock .pin-submit:active{filter:brightness(.92)}
#svter-lock .lock-notice.arriving{animation:lockNotificationIn .8s cubic-bezier(.22,1,.36,1) both}
#svter-lock.lock-unlocking{transform:translateY(-105%);transition:transform 1.05s cubic-bezier(.76,0,.2,1),opacity 1.05s ease}
@media(prefers-reduced-motion:reduce){#svter-lock .lock-content,#svter-lock .pin-layer,#svter-lock .pin-prompt,#svter-lock .pin-hint,#svter-lock .pin-form{transition-duration:.15s}}

/* Opening fiction disclaimer: displayed before the existing loading sequence. */
#fiction-disclaimer{position:fixed;inset:0;z-index:150;background:#0d0d0d;color:#ededed;display:flex;align-items:center;justify-content:center;padding:28px;opacity:0;visibility:visible;pointer-events:none;transition:opacity .7s ease;}
#fiction-disclaimer.visible{opacity:1;}
#fiction-disclaimer.dismissed{opacity:0;visibility:hidden;}
#fiction-disclaimer .disclaimer-copy{font-family:Pretendard,-apple-system,BlinkMacSystemFont,sans-serif;text-align:center;font-size:clamp(15px,2.05vw,29px);font-weight:750;letter-spacing:-.055em;line-height:1.42;word-break:keep-all;max-width:1100px;}
@media(max-width:640px){#fiction-disclaimer .disclaimer-copy{font-size:clamp(15px,3.8vw,22px);line-height:1.55;}}

/* v37: opened mail, composer and send confirmation */
.mail-row.openable{cursor:pointer}.mail-row.openable:hover{background:#f3f8fc}.mail-panel{display:none;min-height:calc(100vh - 230px);background:white}.mail-panel.active{display:block}.mail-content.panel-mode #mail-list,.mail-content.panel-mode #empty-label{display:none}.mail-content.panel-mode .mail-toolbar{padding-bottom:24px}.panel-top{border-bottom:2px solid #e7e7e7;display:flex;align-items:center;justify-content:space-between;gap:10px;min-height:55px}.panel-label{border:1px solid #269c43;color:#269c43;border-radius:24px;padding:7px 20px;font-weight:700;font-size:16px}.panel-actions{display:flex;align-items:center;gap:6px}.panel-actions button,.panel-subnav button{border:0;background:transparent;padding:9px 11px;font-size:15px;cursor:pointer;color:#222}.panel-actions button:hover,.panel-subnav button:hover{color:#269c43}.panel-subnav{display:flex;gap:0;border-bottom:2px solid #e8e8e8;align-items:center;min-height:48px}.panel-subnav button+button{border-left:1px solid #ddd}.panel-subnav .send-action{border:1px solid #269c43;color:#269c43;border-radius:8px;padding:5px 12px}.panel-meta{border-bottom:1px solid #eee;padding:20px 16px 24px}.panel-subject-row{display:flex;align-items:center;gap:12px;justify-content:space-between}.panel-subject-row h2{font-size:17px;margin:0;flex:1;line-height:1.5;letter-spacing:-.04em}.panel-time{font-size:14px;color:#444;white-space:nowrap}.panel-important{border:0;border-radius:14px;background:#b5c1ca;color:white;padding:4px 14px;font-size:12px;font-weight:750}.panel-person{display:flex;align-items:center;gap:16px;margin:12px 0 0 60px;font-size:14px}.panel-person span{background:#e9eaf1;border-radius:20px;padding:5px 16px}.panel-body{position:relative;padding:64px 28px 56px;min-height:440px;white-space:pre-line;line-height:1.65;font-size:15px;letter-spacing:-.035em;border-bottom:1px solid #eee}.attachment{display:flex;justify-content:flex-end;align-items:center;gap:12px;font-size:14px;margin:-24px 0 36px}.attachment button{background:#ececf3;border:0;border-radius:20px;padding:6px 14px;color:#333}.compose-subject{border:0;background:transparent;font:inherit;font-weight:700;flex:1;min-width:0;outline:none}.compose-person input{border:0;background:transparent;outline:none;font:inherit;flex:1;min-width:0}.compose-person input::placeholder,.compose-subject::placeholder,.compose-body::placeholder{color:#b5b5b5}.compose-body{width:100%;min-height:340px;border:0;outline:none;resize:vertical;font:inherit;line-height:1.6;padding:0;background:transparent}.panel-body.compose-area{padding-top:75px}.send-confirm{display:flex;flex-direction:column;align-items:center;justify-content:center;min-height:520px;text-align:center;gap:12px}.send-confirm .success-tag{border:1px solid #269c43;color:#269c43;border-radius:7px;padding:8px 24px;font-weight:700}.send-confirm strong{font-size:19px}.send-confirm p{margin:0;color:#999}.send-confirm button{border:1px solid #ddd;background:white;color:#999;border-radius:5px;padding:7px 15px;cursor:pointer}.send-confirm .confirm-buttons{display:flex;gap:6px;margin-top:28px}
@media(max-width:750px){.panel-subject-row{flex-wrap:wrap}.panel-time{font-size:11px}.panel-body{padding:35px 12px;min-height:350px;font-size:13px}.panel-person{margin-left:0;gap:8px;font-size:12px}.panel-person span{padding:4px 8px}.panel-actions button,.panel-subnav button{font-size:12px;padding:7px}.panel-label{font-size:12px;padding:6px 12px}.mail-panel{min-height:60vh}}

/* v38: alignment, composer spacing, and persistent importance */
.mail-brand{font-size:32px;font-weight:800;letter-spacing:-.045em}
.mail-nav .nav-action{display:flex;align-items:center;justify-content:center;text-align:center;line-height:1.2;box-sizing:border-box}
.panel-subnav{padding:9px 0 12px;min-height:62px;box-sizing:border-box;gap:3px}
.panel-subnav .send-action{margin:0 8px 0 0;align-self:center;line-height:1.3}
.panel-subnav button+button{border-left:1px solid #ddd}
.panel-important.compose-importance{cursor:pointer;flex-shrink:0;transition:background .2s ease,color .2s ease}
.panel-important.is-important{background:#b5c1ca;color:#fff}
.panel-important.is-unimportant{background:#eceef1;color:#777}
@media(max-width:750px){.mail-brand{font-size:24px}.panel-subnav{min-height:58px;padding:9px 0 12px;flex-wrap:wrap}}

/* v39: center both primary action buttons within the sidebar itself */
.mail-nav > .nav-action{display:flex;align-items:center;justify-content:center;width:100%;max-width:240px;margin-left:auto;margin-right:auto;text-align:center;box-sizing:border-box;}

/* Personal preview: incoming mail teaser after the date card. */

/* One-off preview: glitch-in for the final mail teaser, then hold steady. */
#title-interlude.personal-mail-teaser #personal-mail-teaser .teaser-copy{
  animation:teaserGlitchArrival .52s steps(1,end) both;
  will-change:transform,filter,opacity;
}
@keyframes teaserGlitchArrival{
  0%{opacity:0;transform:translate(0,0) skew(0deg);filter:blur(9px);text-shadow:none}
  8%{opacity:1;transform:translate(-9px,2px) skew(-3deg);filter:blur(2px);text-shadow:4px 0 #ff203c,-4px 0 #00c5da}
  16%{opacity:.15;transform:translate(7px,-3px) skew(4deg);filter:blur(4px)}
  27%{opacity:1;transform:translate(-5px,0) skew(-2deg);filter:blur(0);text-shadow:-3px 0 #ff203c,3px 0 #00c5da}
  37%{opacity:.3;transform:translate(3px,1px);filter:blur(2px)}
  49%{opacity:1;transform:translate(5px,-1px) skew(2deg);filter:blur(0);text-shadow:2px 0 #ff203c,-2px 0 #00c5da}
  63%{opacity:.7;transform:translate(-2px,0);filter:blur(1px)}
  78%{opacity:1;transform:translate(1px,0);filter:blur(0);text-shadow:1px 0 #ff203c}
  100%{opacity:1;transform:none;filter:none;text-shadow:none}
}

function shiftMailTimestamp(label){
  const match=/^(\d{2})\.(\d{2})\.(\d{2}) (\d{2}):(\d{2})$/.exec(label);
  if(!match)return label;
  const original=new Date(2000+Number(match[1]),Number(match[2])-1,Number(match[3]),Number(match[4]),Number(match[5]));

}

 const osc=ctx.createOscillator(),env=ctx.createGain();osc.type='triangle';
 osc.frequency.setValueAtTime(185,t);osc.frequency.exponentialRampToValueAtTime(75,t+.055);
 env.gain.setValueAtTime(.085,t);env.gain.exponentialRampToValueAtTime(.0001,t+.065);

function stopFilmWinding(){

// Vintage film-camera shutter: sharp double mechanical clack, no bright-screen flash.
function cameraShutterClack(){
 if(!audioContext||audioContext.state!=='running')return;
 const ctx=audioContext;
 for(const [offset,volume,duration] of [[0,.45,.075],[.085,.31,.095]]){
   const t=ctx.currentTime+offset;
   const buf=ctx.createBuffer(1,Math.ceil(ctx.sampleRate*duration),ctx.sampleRate);
   const data=buf.getChannelData(0);
   for(let i=0;i<data.length;i++){
     const x=i/ctx.sampleRate;
     data[i]=(Math.random()*2-1)*Math.exp(-x*(offset?53:75));
   }
   const src=ctx.createBufferSource(),hp=ctx.createBiquadFilter(),g=ctx.createGain();
   src.buffer=buf;hp.type='highpass';hp.frequency.value=650;
   g.gain.value=volume;src.connect(hp);hp.connect(g);g.connect(ctx.destination);
   src.start(t);src.stop(t+duration);
   const osc=ctx.createOscillator(),env=ctx.createGain();osc.type='square';
   osc.frequency.setValueAtTime(offset?145:210,t);
   osc.frequency.exponentialRampToValueAtTime(70,t+.035);
   env.gain.setValueAtTime(.095,t);env.gain.exponentialRampToValueAtTime(.0001,t+.045);
   osc.connect(env);env.connect(ctx.destination);osc.start(t);osc.stop(t+.05);
 }
}
let titlePlaying=false;

 titlePlaying=true;
 const screen=document.getElementById('title-interlude');
 const wordEl=document.getElementById('kanji-word');
 const symbol=screen.querySelector('div.title-symbol');
 // No fade between the loading failure and the black kanji scene.

 screen.style.opacity='1';
 symbol.style.opacity='';symbol.style.visibility='';symbol.style.backgroundColor='';symbol.style.animation='';
 const words=['信徒','神道','新道'];
 for(let i=0;i<words.length;i++){

 }
 wordEl.classList.remove('change-glitch');
 // The third kanji ends with the last drum; then film winding takes over in total darkness.
 screen.classList.remove('kanji-phase','corrupt','buildup','flash');
 screen.classList.add('pure-black','film-kanji');
 wordEl.classList.remove('change-glitch');
 // Show only one centered kanji at a time, switching through all three every 100 ms.
 const filmWords=['信徒','神道','新道'];
 const dialogueLines=["우리는 지금부터 현대 대한민국의 최고 또라이 집단이 되는 거야.", "우리는 굳건하고 흔들리지 않을 것입니다. 제가 그렇게 만들 것입니다.", "이 정도는 괜찮아. 대신 다음엔 조심해줘. 난 이곳이 무너지지 않길 원하니까.", "나의, 주의 뜻으로 전해질 겁니다.", "竟敢我的兄弟. 以血还血.", "원하는 그림? 너 지금 이 미친 꽃 대가리 그림이 원하는 그림으로 보여?", "어차피 죽을 거 즐겁게 죽는 게 재밌잖아.", "왜 나한테는 기회를 주지 않는 거야? 내가 얼마나 더 노력해야 하는데!", "새벽 3시 전에는 돌아올게", "다 먹고 살자고 하는 짓이지 뭐.", "이번에는 꼭 반드시. 완벽하게 해내보이겠습니다.", "이런 기분은 살면서 처음이에요. 두렵지만… 흥분됩니다. 저를 이해하세요?", "신께 닿아 사해졌습니다. 당신의 생활에 행복과 안식이 있기를."];
 const kanjiRow=wordEl.parentElement;
 kanjiRow.replaceChildren(wordEl);
 wordEl.className='kanji-word';
 wordEl.style.color='#c00000';
 let filmFrame=0, dialogueIndex=0, kanjiIndex=0;
 function shuffleFilmKanji(){
   // One 100 ms frame in every three is a spoken line; all 13 appear in order.
   const isDialogue=filmFrame%3===2 && dialogueIndex<dialogueLines.length;
   const word=isDialogue?dialogueLines[dialogueIndex++]:filmWords[(kanjiIndex++)%filmWords.length];
   wordEl.textContent=word;wordEl.dataset.word=word;
   wordEl.classList.remove('film-swap','dialogue-frame');

 let nextFilmTick=0,nextFilmFrame=100;
 while(performance.now()-windingStart<windingDuration){
   const elapsed=performance.now()-windingStart;
   const progress=Math.min(1,elapsed/windingDuration);
   if(elapsed>=nextFilmTick){
     filmWindTick(progress);
     nextFilmTick=elapsed+Math.max(80,225-125*Math.pow(progress,1.65));

}
